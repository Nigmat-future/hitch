name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - run: node bin/hitch.js --help

  install-sh:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install from a local archive, run, update, uninstall
        shell: sh
        run: |
          set -eu
          sh -n install.sh
          mkdir -p "$RUNNER_TEMP/pkg/hitch-main"
          cp -R bin src package.json LICENSE README.md PRIVACY.md "$RUNNER_TEMP/pkg/hitch-main/"
          (cd "$RUNNER_TEMP/pkg" && tar -czf hitch.tar.gz hitch-main)
          export HITCH_ARCHIVE="$RUNNER_TEMP/pkg/hitch.tar.gz" HITCH_INSTALL_DIR="$RUNNER_TEMP/app" HITCH_BIN_DIR="$RUNNER_TEMP/bin"
          sh install.sh
          test "$("$RUNNER_TEMP/bin/hitch" --version)" = "$(node -p "require('./package.json').version")"
          sh < install.sh
          sh -s -- --uninstall < install.sh
          test ! -e "$RUNNER_TEMP/bin/hitch" && test ! -e "$RUNNER_TEMP/app"

  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install from a local archive, run, uninstall
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "pkg\hitch-main"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          foreach ($item in "bin","src","package.json","LICENSE","README.md","PRIVACY.md") { Copy-Item -Recurse $item $pkg }
          Compress-Archive -Path $pkg -DestinationPath (Join-Path $env:RUNNER_TEMP "hitch.zip")
          $env:HITCH_ARCHIVE = Join-Path $env:RUNNER_TEMP "hitch.zip"
          $env:HITCH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "app"
          $env:HITCH_BIN_DIR = Join-Path $env:RUNNER_TEMP "bin"
          $env:HITCH_NO_PATH = "1"
          ./install.ps1
          $version = & (Join-Path $env:HITCH_BIN_DIR "hitch.cmd") --version
          if ($version -ne (node -p "require('./package.json').version")) { throw "launcher returned '$version'" }
          $env:HITCH_UNINSTALL = "1"
          ./install.ps1
          if (Test-Path $env:HITCH_INSTALL_DIR) { throw "uninstall left files behind" }
